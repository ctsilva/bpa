name: CI
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DoozyX/clang-format-lint-action@v0.18
        with:
          extensions: 'cpp,h'
          clangFormatVersion: 18

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
          - os: ubuntu-24.04
            cxx: clang++
          - os: macos-14
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: dependencies (apt)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libglm-dev catch2
      - name: dependencies (brew)
        if: runner.os == 'macOS'
        run: brew install glm catch2
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/homebrew
      - name: build
        run: cmake --build build
      - name: tests
        run: cd build && ./tests
      - name: driver
        run: ./build/bpa test/data/bunny.xyz 0.002 build/bunny.off
